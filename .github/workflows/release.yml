name: Compile and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'web-ui/package-lock.json'

    - name: Build React UI
      run: |
        cd web-ui
        npm ci
        npm run build

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compile Main Executable
      run: |
        python -m PyInstaller valorant-rpc.spec --clean --noconfirm

    - name: Compile Setup Installer
      run: |
        python -m PyInstaller --onefile --noconsole --name "valorant-rpc-setup" --add-data "dist/valorant-rpc.exe;." installer.py

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dist/valorant-rpc-setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
